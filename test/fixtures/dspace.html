<meta name="DCTERMS.abstract" content="Metal-organic frameworks (MOFs) are porous crystalline materials with potential applications in carbon capture. In this thesis, we report the synthesis of three new zirconium-based MOFs and investigate their CO2 adsorption using gas sorption isotherms and in situ infrared spectroscopy. Density functional theory calculations reveal the binding sites of CO2 within the pores. The zirconium MOFs show high stability in humid flue gas. Finally, machine learning models are used to screen 2,000 hypothetical MOFs for carbon capture performance.">
